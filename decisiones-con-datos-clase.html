*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg-body);
  color:var(--text-body);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
  min-height:100vh;
  display:flex;flex-direction:column;
}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;color:var(--text-heading)}

nav{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 2rem;
  backdrop-filter:blur(20px);
  background:var(--nav-bg);
  border-bottom:1px solid var(--nav-border);
}
.nav-logo{display:flex;align-items:center;gap:.65rem;text-decoration:none}
.nav-logo img{height:32px;width:auto;display:block;object-fit:contain}
.nav-logo-text{font-weight:700;font-size:1rem;color:var(--text-heading);letter-spacing:-.02em}

.theme-toggle{
  width:36px;height:36px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .3s,border-color .3s,transform .2s;flex-shrink:0;
}
.theme-toggle:hover{transform:scale(1.08)}
.theme-toggle svg{width:16px;height:16px;fill:none;stroke:var(--violet);stroke-width:2;stroke-linecap:round}
.icon-sun{display:var(--theme-icon-sun)}
.icon-moon{display:var(--theme-icon-moon)}

main{flex:1;padding:3.5rem 2rem;display:flex;flex-direction:column;align-items:center;gap:2rem}
.clase-header{text-align:center;max-width:600px}
.clase-tag{
  display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--violet2);background:rgba(123,97,255,.1);border:1px solid rgba(123,97,255,.2);
  padding:.3rem .8rem;border-radius:999px;margin-bottom:1rem;
}
.clase-header h1{font-size:clamp(1.5rem,3.5vw,2.1rem);margin-bottom:.6rem}
.clase-header p{color:var(--gray-mid);font-size:.95rem;line-height:1.55}

#auth-gate{width:100%}

footer{background:var(--footer-bg);border-top:1px solid var(--nav-border);padding:1.5rem 2rem;text-align:center}
footer p{font-size:.8rem;color:var(--gray-mid)}
footer a{color:var(--violet2);text-decoration:none}

<script>
const html = document.documentElement;
const btn = document.getElementById('themeToggle');
const saved = localStorage.getItem('af-theme');
if (saved === 'light') html.classList.remove('dark');
btn.addEventListener('click', () => {
  const isDark = html.classList.toggle('dark');
  localStorage.setItem('af-theme', isDark ? 'dark' : 'light');
});
</script>
